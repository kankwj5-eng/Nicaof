name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches:
      - principal

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Instalar Java (necesario para Gradle/Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar EAS CLI
        run: npm install -g eas-cli

      - name: Compilar APK localmente
        run: eas build --platform android --profile preview --local --non-interactive --output ./app-release.apk

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: apk-compilado
          path: ./app-release.apk
